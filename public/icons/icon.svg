<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cos-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C7CF5" />
      <stop offset="60%" stop-color="#A56CF8" />
      <stop offset="100%" stop-color="#EC5B9A" />
    </linearGradient>
    <linearGradient id="cos-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E4B" />
      <stop offset="100%" stop-color="#EC5B9A" />
    </linearGradient>
    <filter id="cos-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#0A0A12" />
  
  <!-- Subtle Border Highlight -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1E1E2E" stroke-width="6" />

  <!-- Glow effect -->
  <circle cx="256" cy="256" r="160" fill="#7C7CF5" opacity="0.12" filter="url(#cos-glow)" />

  <!-- ContentOS "C" Shape Outer Loop -->
  <path d="M 330 155 
           A 135 135 0 1 0 330 357" 
        fill="none" 
        stroke="url(#cos-gradient)" 
        stroke-width="54" 
        stroke-linecap="round" />

  <!-- Inner Sparkle / Intel Dot -->
  <circle cx="330" cy="256" r="28" fill="url(#cos-accent)" />
</svg>
